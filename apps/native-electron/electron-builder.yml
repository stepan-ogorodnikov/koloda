appId: com.koloda.app
productName: KOLODA
directories:
  output: dist-pack
  buildResources: build
# Flatten dist/ into asar root so packaged `__dirname` is sibling to preload + .node,
# and `../native-electron-react` resolves to extraResources (see main.ts loadFile).
files:
  - from: dist
    filter:
      - "**/*"
      - "!tsconfig*"
      - "!**/*.d.ts"
      - "!**/*.d.ts.map"
      - "!**/*.tsbuildinfo"
extraMetadata:
  main: main.cjs
asarUnpack:
  - "**/*.node"
extraResources:
  - from: ../native-electron-react/dist
    to: native-electron-react
mac:
  category: public.app-category.education
  target:
    - dmg
    - zip
  icon: build/icon.icns
  hardenedRuntime: true
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  icon: build/icons
  category: Education
