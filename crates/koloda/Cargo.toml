[package]
name = "koloda"
version = "0.0.1"
edition = "2021"
# Two explicit binaries (`domain`, `integration`). Do not add `tests/*.rs` crate roots.
autotests = false

[lints]
workspace = true

[[test]]
name = "domain"
path = "tests/domain/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
refinery = { version = "0.8", features = ["rusqlite"] }
rusqlite = { version = "0.33", features = ["bundled"] }
json-patch = "4.0"
strum = "0.27"
strum_macros = "0.27"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v7"] }
url = "2.5"
sha2 = "0.10"
koloda-sync-proto = { path = "../koloda-sync-proto" }

# WHY: keyring has no default store; without a platform feature it falls back to an in-memory mock and keys
# vanish on restart. Each supported OS names its native store; other targets fail to build instead.
# `vendored` builds libdbus from source so Linux builders need no libdbus-1-dev.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials"] }

[dev-dependencies]
chrono-tz = "0.10"
