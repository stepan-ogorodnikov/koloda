name: CI

# The main ruleset requires the job `checks` to pass on a commit before main
# can move to it. Renaming the job blocks every push to main.
# Branch pushes are how a commit gets checked; see `bun run land`.
# Main itself is not re-checked: it only fast-forwards to checked commits.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Set up Rust
        run: rustup toolchain install && rustc --version

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dist/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Install
        run: bun install

      - name: Check push
        run: bun run check:push
