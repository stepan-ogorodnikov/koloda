name: CI

# The main ruleset requires the job `checks` to pass on a commit before main
# can move to it. Renaming the job blocks every push to main.
# Branch pushes are how a commit gets checked; see `bun run land`.
# Main itself is not re-checked: it only fast-forwards to checked commits.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Main only moves to checked commits, so a branch whose diff against main
      # is all markdown has checked code. Then only the format check and the
      # workspace tests (docs.test.ts reads the docs) need to run.
      # An empty diff, or a failed fetch, runs the full check.
      - name: Classify changes
        id: scope
        shell: bash
        run: |
          docs_only=false
          if git fetch --no-tags --depth=1 origin main; then
            files=$(git diff --name-only --no-renames FETCH_HEAD HEAD || true)
            if [[ -n "$files" ]] && ! grep -qvE '\.md$' <<< "$files"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Markdown-only: $docs_only"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Also needed for docs-only checks: dprint runs rustfmt on every .rs file.
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Set up Rust
        run: rustup toolchain install && rustc --version

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # actions/cache saves only on a key miss. A run-specific key saves this
      # run's results, and restore takes the newest entry with the prefix.
      - name: Cache Cargo
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dist/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Cache Nx
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nx-${{ runner.os }}-

      # dprint downloads the plugins listed in dprint.json on first run.
      - name: Cache dprint
        uses: actions/cache@v4
        with:
          path: ~/.cache/dprint
          key: dprint-${{ runner.os }}-${{ hashFiles('dprint.json') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check push
        env:
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
        run: |
          if [[ "$DOCS_ONLY" == "true" ]]; then
            bun run check:format
            bun run check:workspace-deps
          else
            bun run check:push
          fi
